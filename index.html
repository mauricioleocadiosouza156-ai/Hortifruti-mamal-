<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hortifruti Mamau — Loja Online</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f4f7f1;color:#24301f}
header{background:linear-gradient(135deg,#2e7d32,#5da83d);color:#fff;padding:24px 16px;text-align:center;position:sticky;top:0;z-index:5}
header h1{margin:0 0 6px;font-size:29px}header p{margin:0}
.wrap{max-width:950px;margin:auto;padding:16px 16px 110px}.search{width:100%;padding:14px;border:1px solid #ccd5c7;border-radius:12px;font-size:16px;margin:8px 0 18px}
.cat{margin:22px 0}.cat h2{font-size:21px;margin:0 0 12px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:11px}
.card{background:#fff;border-radius:14px;padding:14px;box-shadow:0 2px 10px #00000012}.card h3{margin:0 0 8px;font-size:16px}.price{font-weight:bold;color:#2e7d32;margin-bottom:10px}
.controls{display:flex;gap:7px;align-items:center}.qty{width:42px;text-align:center;font-weight:bold}.btn{border:0;border-radius:10px;padding:10px 12px;cursor:pointer;font-weight:bold}.minus,.plus{background:#e8f0e5;color:#2e7d32}.add{background:#2e7d32;color:#fff;flex:1}
.cartbar{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid #ddd;padding:11px 15px;display:flex;justify-content:center;z-index:10}.cartbtn{width:min(900px,100%);background:#1f7a34;color:#fff;border:0;border-radius:14px;padding:14px;font-size:17px;font-weight:bold}
.modal{display:none;position:fixed;inset:0;background:#0008;z-index:20;padding:15px;overflow:auto}.modal.show{display:block}.box{background:#fff;max-width:620px;margin:25px auto;border-radius:18px;padding:20px}.close{float:right;border:0;background:#eee;border-radius:50%;width:34px;height:34px;font-size:20px}
.row{display:flex;justify-content:space-between;gap:10px;border-bottom:1px solid #eee;padding:11px 0}.total{font-size:21px;font-weight:bold;margin:18px 0}.field{width:100%;padding:12px;border:1px solid #ccc;border-radius:10px;margin:7px 0 12px}.pix{background:#e9f7eb;padding:14px;border-radius:12px;margin:12px 0}.checkout{width:100%;background:#25a244;color:#fff;border:0;border-radius:12px;padding:14px;font-size:16px;font-weight:bold;cursor:pointer}
.empty{text-align:center;padding:25px;color:#667}
.note{font-size:13px;color:#666;margin-top:8px}
</style>
</head>
<body>
<header><h1>🥬 Hortifruti Mamau</h1><p>Escolha seus produtos e monte seu carrinho</p></header>

<main class="wrap">
<input class="search" id="search" placeholder="🔎 Procurar produto..." oninput="render()">
<div id="catalog"></div>
</main>

<div class="cartbar"><button class="cartbtn" onclick="openCart()">🛒 Carrinho (<span id="count">0</span>) — R$ <span id="barTotal">0,00</span></button></div>

<div class="modal" id="cartModal">
<div class="box">
<button class="close" onclick="closeCart()">×</button>
<h2>🛒 Seu carrinho</h2>
<div id="cartItems"></div>
<div class="total">Total: R$ <span id="total">0,00</span></div>
<label>Nome</label><input class="field" id="name" placeholder="Seu nome">
<label>Forma de pagamento</label>
<select class="field" id="payment" onchange="togglePix()"><option value="pix">Pix</option><option value="entrega">Pagamento na entrega</option></select>
<div class="pix" id="pixBox">
<strong>💚 Pagamento via Pix</strong>
<p>Chave Pix: <b>COLOQUE-SUA-CHAVE-PIX-AQUI</b></p>
<p class="note">Chave Pix: informe a chave da loja para o pagamento.</p>
</div>
<button class="checkout" onclick="finishOrder()">Finalizar pedido pelo WhatsApp</button>
<p class="note">O botão monta o pedido e abre o WhatsApp com os produtos, quantidades e total.</p>
</div>
</div>

<script>
const products = [
["Limpeza e higiene","Água sanitária"],["Limpeza e higiene","Água sanitária Econômica Ibrinorte"],["Limpeza e higiene","Sabão em pó Ala"],["Limpeza e higiene","Papel higiênico Floral"],["Limpeza e higiene","Limpol azul com cheiro"],["Limpeza e higiene","Sabão em barra — grande"],["Limpeza e higiene","Sabão em barra — pequeno"],["Limpeza e higiene","Esponja"],["Limpeza e higiene","Sabão líquido"],["Limpeza e higiene","Incenso"],
["Alimentos","Arroz"],["Alimentos","Café"],["Alimentos","Leite"],["Alimentos","Açúcar"],["Alimentos","Sal"],["Alimentos","Óleo"],["Alimentos","Colorau"],["Alimentos","Alho"],["Alimentos","Pimenta-do-reino"],["Alimentos","Fermento"],["Alimentos","Trigo"],["Alimentos","Mucilon"],["Alimentos","Bolacha"],["Alimentos","Biscoito"],["Alimentos","Sopinha de copo"],["Alimentos","Sopinha de plástico"],["Alimentos","Conserva"],["Alimentos","Leite condensado"],["Alimentos","Creme de leite"],["Alimentos","Macarrão"],["Alimentos","Vinagre"],["Alimentos","Suco"],["Alimentos","Ovo"],
["Verduras, frutas e legumes","Banana"],["Verduras, frutas e legumes","Banana pequena"],["Verduras, frutas e legumes","Cebola branca"],["Verduras, frutas e legumes","Cebola roxa"],["Verduras, frutas e legumes","Tomate"],["Verduras, frutas e legumes","Batata"],["Verduras, frutas e legumes","Batata-doce"],["Verduras, frutas e legumes","Maracujá"],["Verduras, frutas e legumes","Limão"],["Verduras, frutas e legumes","Cheiro-verde"],["Verduras, frutas e legumes","Pimenta-cheirosa"],
["Outros","Carvão"],["Outros","Milito"]
];

const prices = {};
products.forEach((p,i)=>prices[p[1]]=0); // 0 means "preço a definir"
let cart = JSON.parse(localStorage.getItem("mamaCart")||"{}");

function money(v){return v.toLocaleString("pt-BR",{minimumFractionDigits:2,maximumFractionDigits:2})}
function render(){
 const q=document.getElementById("search").value.toLowerCase();
 const cats={};
 products.forEach(([cat,name])=>{if(name.toLowerCase().includes(q)){(cats[cat]??=[]).push(name)}});
 let out="";
 for(const cat in cats){
   out+=`<section class="cat"><h2>${cat}</h2><div class="grid">`;
   cats[cat].forEach(name=>{
     const price=prices[name]||0, qty=cart[name]||0;
     out+=`<div class="card"><h3>${name}</h3><div class="price">${price?`R$ ${money(price)}`:"Preço a definir"}</div>
     <div class="controls"><button class="btn minus" onclick="change('${esc(name)}',-1)">−</button><span class="qty">${qty}</span><button class="btn plus" onclick="change('${esc(name)}',1)">+</button><button class="btn add" onclick="change('${esc(name)}',1)">Adicionar</button></div></div>`;
   });
   out+="</div></section>";
 }
 document.getElementById("catalog").innerHTML=out||'<div class="empty">Produto não encontrado.</div>';
 updateBar();
}
function esc(s){return s.replace(/\\/g,"\\\\").replace(/'/g,"\\'")}
function change(name,delta){cart[name]=Math.max(0,(cart[name]||0)+delta);if(!cart[name])delete cart[name];localStorage.setItem("mamaCart",JSON.stringify(cart));render()}
function totals(){let count=0,total=0;for(const [n,q] of Object.entries(cart)){count+=q;total+=q*(prices[n]||0)}return {count,total}}
function updateBar(){const t=totals();document.getElementById("count").textContent=t.count;document.getElementById("barTotal").textContent=money(t.total)}
function openCart(){document.getElementById("cartModal").classList.add("show");drawCart()}
function closeCart(){document.getElementById("cartModal").classList.remove("show")}
function drawCart(){
 const box=document.getElementById("cartItems"), entries=Object.entries(cart);
 if(!entries.length)box.innerHTML='<div class="empty">Seu carrinho está vazio.</div>';
 else box.innerHTML=entries.map(([n,q])=>`<div class="row"><span>${q}× ${n}</span><strong>R$ ${money(q*(prices[n]||0))}</strong></div>`).join("");
 document.getElementById("total").textContent=money(totals().total);togglePix()
}
function togglePix(){document.getElementById("pixBox").style.display=document.getElementById("payment").value==="pix"?"block":"none"}
function finishOrder(){
 const entries=Object.entries(cart);if(!entries.length){alert("Adicione pelo menos um produto ao carrinho.");return}
 const name=document.getElementById("name").value.trim()||"Cliente";
 const pay=document.getElementById("payment").value==="pix"?"Pix":"Pagamento na entrega";
 let msg=`Olá, Hortifruti Mamau!%0AQuero fazer este pedido:%0A%0A`;
 entries.forEach(([n,q])=>msg+=`• ${q}x ${encodeURIComponent(n)}%0A`);
 const t=totals().total;
 msg+=`%0ATotal: R$ ${money(t)}%0APagamento: ${pay}%0ANome: ${encodeURIComponent(name)}`;
 // Replace 55XXXXXXXXXXX with the store's WhatsApp number.
 const phone="5597984371427";
 window.open(`https://wa.me/${phone}?text=${msg}`,"_blank");
}
render();
</script>
</body>
</html>
